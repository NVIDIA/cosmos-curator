syntax = "proto3";

package cosmos_curator.sensors.egotrajectory.v1;

// One time-stamped sensor-native pose in a clip-local ENU world frame.
message EgotrajectorySample {
  // Source-measurement time in Unix nanoseconds.
  uint64 sensor_timestamp_ns = 1;
  // Recorder/host clock time in Unix nanoseconds. This is optional at the
  // mapping level: omit its mapping when a source does not provide host time.
  // A mapped but omitted proto3 scalar decodes as 0.
  uint64 host_timestamp_ns = 2;
  // Monotonically increasing source sequence number. This is optional at the
  // mapping level: omit its mapping when a source does not provide a sequence.
  // A mapped but omitted proto3 scalar decodes as 0.
  uint64 sequence_counter = 3;

  // Exactly three metres: the translation component of
  // T_worldENU_from_sensorBody in X, Y, Z order. As a proto3 repeated numeric
  // field, this is packed on the wire.
  repeated double position_m = 4;

  // Exactly four values: the rotation component of
  // T_worldENU_from_sensorBody as a unit quaternion in X, Y, Z, W order.
  // As a proto3 repeated numeric field, this is packed on the wire.
  repeated double orientation_xyzw = 5;

  // True when the position and orientation were derived from finite in-range
  // position and attitude about a valid local ENU anchor. False means the
  // sample is preserved for timeline continuity but the position is zero and
  // orientation is identity; consumers must not trust that placeholder.
  bool pose_valid = 6;
}
