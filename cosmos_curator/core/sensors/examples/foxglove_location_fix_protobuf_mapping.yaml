#
# Mapping for a valid-only ``foxglove.LocationFix`` MCAP channel. The embedded
# Foxglove ``timestamp`` is the sensor timestamp; ``align_timestamp_ns`` is
# intentionally omitted so the GPS sensor defaults it to that mapped timestamp.
#
# The Foxglove writer only emits usable position fixes, so every output position
# component is marked valid. LocationFix covariance, heading, velocity, and
# metadata remain intentionally unmapped until their sensor-library contracts
# are defined.

fields:
  sensor_timestamp_ns:
    from: timestamp
    type: protobuf_timestamp

  latitude_deg:
    from: latitude
    type: float
  longitude_deg:
    from: longitude
    type: float
  altitude_m:
    from: altitude
    type: float
  position_valid:
    default: [true, true, true]
