#
# Mapping for Foxglove's singular ``foxglove.PoseInFrame`` schema. Use this
# file with ``EgoTrajectorySensor(schema_name="foxglove.PoseInFrame")``.
# Each MCAP message becomes one EgoTrajectory row. The mapping consumer
# supplies the target row class, so there is no `target` entry.
#
# Foxglove's embedded ``timestamp`` is the source and, because
# align_timestamp_ns is omitted, the alignment timestamp. ``frame_id`` is
# deliberately not mapped; frame naming is sensor-library configuration.

fields:
  sensor_timestamp_ns:
    from: timestamp
    type: protobuf_timestamp

  position_m:
    group: [pose.position.x, pose.position.y, pose.position.z]
    type: float

  orientation_xyzw:
    group: [pose.orientation.x, pose.orientation.y, pose.orientation.z, pose.orientation.w]
    type: float

  pose_valid:
    default: true
