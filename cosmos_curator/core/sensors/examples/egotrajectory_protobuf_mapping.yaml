# Complete mapping for the reference EgotrajectorySample schema in
# core/sensors/schemas/egotrajectory.proto. Use this file unchanged for that
# message, or copy it and replace the source paths and units for another
# protobuf schema. The mapping consumer supplies the target row class, so there
# is no `target` entry.
#
# EgotrajectorySample is the channel message itself, so this mapping has no
# `root`. Library-only fields (`align_timestamp_ns`, `frame`) are not mapped
# here: align defaults to the sensor timestamp, and frame is set by the sensor.

fields:
  # Required source measurement timestamp. align_timestamp_ns is omitted
  # intentionally, so it defaults to this mapped sensor timestamp.
  sensor_timestamp_ns:
    from: sensor_timestamp_ns
    type: timestamp
    unit: ns

  # Optional at the mapping level. Remove these entries when a source does not
  # provide the metadata. Mapped proto3 scalars produce arrays for every row;
  # an omitted wire value decodes as 0.
  host_timestamp_ns:
    from: host_timestamp_ns
    type: timestamp
    unit: ns

  sequence_counter:
    from: sequence_counter
    type: int

  # Required translation (exactly three doubles) and unit XYZW quaternion
  # (exactly four doubles). The sensor stacks these scalar vectors directly
  # into EgoTrajectory's canonical position and orientation arrays.
  position_m:
    from: position_m
    type: float

  orientation_xyzw:
    from: orientation_xyzw
    type: float

  pose_valid:
    from: pose_valid
    type: bool
