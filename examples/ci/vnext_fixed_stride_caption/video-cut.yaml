#
# k8s_gpu_extended scenario `vnext_fixed_stride_caption`, step 1/3. run_vnext_recipes.sh renders
# the environment variables S3_INPUT_VIDEO_PATH and VNEXT_MEDIA_ROOT into this file before running it.
schema_version: 1
kind: video-cut
input:
  root_uri: ${S3_INPUT_VIDEO_PATH}
split:
  method: fixed-stride
  duration_s: 10
  stride_s: 10
  min_duration_s: 2
output:
  media_root: ${VNEXT_MEDIA_ROOT}
execution:
  max_items: 1
