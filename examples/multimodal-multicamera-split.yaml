schema_version: 1
kind: multimodal-split
input:
  input_path_prefix: /data/recordings
# Illustrative rig: enumerate EVERY camera in your rig, not only caption selections.
# Expected layout: <source-id>/recorder-*/<media-file> and MP4 .timestamps.npy sidecars.
sensors:
  front_wide:
    sensor_type: camera
    uri_pattern: '*/front.mp4'
    required: true
  left_fisheye:
    sensor_type: camera
    uri_pattern: '*/side.mp4'
    required: true
  rear_fisheye:
    sensor_type: camera
    uri_pattern: '*/rear.mp4'
    required: true
  ego_pose:
    sensor_type: egotrajectory
    uri_pattern: '*/egotrajectory.mcap'
    required: true
    topic: /egotrajectory
output:
  path: /data/curated/full-rig
clip:
  whole_session: false
  duration_s: 10.0
  sampling_fps: 30
video:
  max_delta_s: 0.05
  encoder:
    video_encoder: libopenh264
    video_bitrate: 4M
    gop_size: 30
    faststart: true
execution:
  storage_profile: default
