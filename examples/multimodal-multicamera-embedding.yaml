# Embed both views in one run, using the camera tags from the caption examples.
# Workflow: docs/curator/guides/multimodal-av-e2e.md.
# Set video.camera_keys: all to embed all three views produced by multimodal-multicamera-split.yaml.
# Captions are optional: embeddings read camera MP4s directly from the same episode table.
schema_version: 1
kind: multimodal-embedding
input:
  episodes_lance_uri: /data/curated/full-rig/episodes.lance
video:
  camera_keys: [front_wide, left_fisheye]
model:
  variant: cosmos_embed1_336p
output:
  result_key: default
execution:
  storage_profile: default
  inference_batch_size: 4
