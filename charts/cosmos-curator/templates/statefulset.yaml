{{- include "curator-ray.validateOtlp" . }}
{{- $otlpCertPath := include "curator-ray.otlp.certPath" . }}
{{- $otlpKeyPath := include "curator-ray.otlp.keyPath" . }}
{{- $otlpCaPath := include "curator-ray.otlp.caPath" . }}
{{- $otlpCertDir := dir $otlpCertPath }}
{{- $otlpEnabled := include "curator-ray.otlp.enabled" . | eq "true" }}
{{- $otlpCertsEnabled := or .Values.otlp.tls.secret.enabled .Values.otlp.extractNVCFSecrets }}
{{- $otlpCertsMounted := and $otlpEnabled $otlpCertsEnabled }}
{{/*
Only the in-process exporters read the client key from the curator container.
With logging alone the sidecar is the only consumer, so the key is not mounted
into a container that has no OTEL_EXPORTER_OTLP_* configuration to use it.
*/}}
{{- $otlpAppCertsMounted := and $otlpCertsMounted (or .Values.metrics.otlpPush.enabled .Values.tracing.otlp.enabled) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "curator-ray.name" . }}
  labels:
    {{- include "curator-ray.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "curator-ray.name" . }}-headless
  podManagementPolicy: Parallel
  replicas: {{ .Values.replicas }}
  {{- if .Values.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .Values.persistence.retentionPolicy.whenDeleted }}
    whenScaled: {{ .Values.persistence.retentionPolicy.whenScaled }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "curator-ray.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
      {{- if .Values.rayAuth.enabled }}
        checksum/ray-auth-token: {{ include (print $.Template.BasePath "/ray-auth-token-secret.yaml") . | sha256sum }}
      {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "curator-ray.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.logging.otlp.enabled }}
      terminationGracePeriodSeconds: {{ .Values.logging.otlp.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if and $otlpCertsMounted .Values.otlp.extractNVCFSecrets }}
      initContainers:
        - name: otlp-secret-extractor
          image: nvcr.io/nvidia/distroless/python:3.13-v3.1.3
          command: ["python"]
          args: ["/scripts/extractor.py"]
          env:
            - name: SECRET_EXTRACTOR_OUTPUT_DIR
              value: {{ $otlpCertDir | quote }}
            - name: SECRET_EXTRACTOR_CERT_FILE
              value: {{ base $otlpCertPath | quote }}
            - name: SECRET_EXTRACTOR_KEY_FILE
              value: {{ base $otlpKeyPath | quote }}
            {{- if $otlpCaPath }}
            - name: SECRET_EXTRACTOR_CA_FILE
              value: {{ base $otlpCaPath | quote }}
            {{- end }}
            - name: SECRET_EXTRACTOR_CERT_KEY
              value: {{ .Values.otlp.nvcfSecrets.certKey | quote }}
            - name: SECRET_EXTRACTOR_KEY_KEY
              value: {{ .Values.otlp.nvcfSecrets.keyKey | quote }}
            {{- /* Only require a CA from the NVCF secret when something reads it.
                   The extractor hard-fails on a configured-but-absent CA key, so
                   asking for one without an otlp.tls.caPath would block startup
                   for backends that use a publicly trusted certificate. */}}
            {{- if and $otlpCaPath .Values.otlp.nvcfSecrets.caKey }}
            - name: SECRET_EXTRACTOR_CA_KEY
              value: {{ .Values.otlp.nvcfSecrets.caKey | quote }}
            {{- end }}
          volumeMounts:
            - name: otlp-secret-extractor-script
              mountPath: /scripts
            - name: otlp-cert-store
              mountPath: {{ $otlpCertDir | quote }}
            - name: otlp-input-secrets
              mountPath: /var/secrets
      {{- end }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmem.limit }}
        - name: temp
          emptyDir: {}
      {{- if not .Values.persistence.enabled }}
      {{- if .Values.scratchDir }}
        - name: scratch
          hostPath:
            path: {{ .Values.scratchDir }}
            type: Directory
      {{- else }}
        - name: scratch
          emptyDir: {}
      {{- end }}
      {{- end }}
      {{- if .Values.s3.secret.enabled }}
        - name: s3config
          projected:
            defaultMode: 420
            sources:
            - secret:
                name: {{ .Values.s3.secret.name }}
      {{- end }}
        - name: curator-config
          configMap:
            name: curator-config
            defaultMode: 0440
      {{- if .Values.logging.otlp.enabled }}
        - name: otlp-log-collector-config
          configMap:
            name: {{ default (printf "%s-otlp-log-collector-config" (include "curator-ray.name" .)) .Values.logging.otlp.configMap.existingName }}
            defaultMode: 0440
            items:
              - key: {{ .Values.logging.otlp.configMap.key | quote }}
                path: relay.yaml
        - name: otlp-log-collector-storage
          emptyDir:
            sizeLimit: {{ .Values.logging.otlp.storageSizeLimit | quote }}
      {{- end }}
      {{- if $otlpCertsMounted }}
      {{- if .Values.otlp.extractNVCFSecrets }}
        - name: otlp-secret-extractor-script
          configMap:
            name: secret-extractor
            defaultMode: 0755
        - name: otlp-cert-store
          emptyDir:
            medium: Memory
            sizeLimit: 5Mi
        - name: otlp-input-secrets
          secret:
            secretName: {{ .Values.otlp.nvcfSecrets.secretName }}
      {{- else if .Values.otlp.tls.secret.enabled }}
        - name: otlp-cert-store
          secret:
            secretName: {{ .Values.otlp.tls.secret.name }}
            defaultMode: 0440
      {{- end }}
      {{- end }}
      {{- if .Values.rayAuth.enabled }}
        - name: ray-auth-token
          secret:
            secretName: ray-auth-token
            defaultMode: 0440
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.ngcImagePullSecretName }}
      imagePullSecrets:
      - name: {{ .Values.ngcImagePullSecretName }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      subdomain: {{ include "curator-ray.name" . }}-headless
      containers:
        - name: {{ include "curator-ray.name" . }}
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /tmp
              name: temp
            - mountPath: /config
              name: scratch
           {{- if .Values.s3.secret.enabled }}
            - mountPath: /s3config
              name: s3config
              readOnly: true
           {{- end }}
           {{- if .Values.rayAuth.enabled }}
            - mountPath: /ray-auth
              name: ray-auth-token
              readOnly: true
           {{- end }}
           {{- if $otlpAppCertsMounted }}
            - mountPath: {{ $otlpCertDir | quote }}
              name: otlp-cert-store
              readOnly: true
           {{- end }}
           {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
           {{- end }}
          {{- if .Values.command}}
          command:
{{/* Allow for newline and proper indent */}}
          {{- toYaml .Values.command | indent 10 }}
          {{- end }}
          {{- if .Values.args }}
          args:
          {{- toYaml .Values.args | nindent 10 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODES_PER_INSTANCE
              value: {{ .Values.replicas | quote }}
            - name: HEADLESS_SERVICE_NAME
              value: {{ include "curator-ray.name" . }}-headless
            - name: RAY_GCS_SERVER_PORT
              value: {{ .Values.rayPorts.gcsServerPort | quote }}
            - name: RAY_DASHBOARD_PORT
              value: {{ .Values.rayPorts.dashboardPort | quote }}
            - name: RAY_OBJECT_MANAGER_PORT
              value: {{ .Values.rayPorts.objectManagerPort | quote }}
            - name: RAY_NODE_MANAGER_PORT
              value: {{ .Values.rayPorts.nodeManagerPort | quote }}
            {{- if .Values.rayAuth.enabled }}
            - name: RAY_AUTH_TOKEN_PATH
              value: "/ray-auth/token"
            {{- end }}
            {{- if and .Values.logging.otlp.enabled (not .Values.command) }}
            - name: COSMOS_CURATOR_TEE_STDOUT_STDERR
              value: "true"
            {{- end }}
            {{- if .Values.huggingFaceHubToken }}
            - name: HUGGING_FACE_HUB_TOKEN
              value: {{ .Values.huggingFaceHubToken | quote }}
            {{- end }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
          - configMapRef:
              name: curator-config
          {{- if .Values.ngcCatalog.secret.enabled }}
          - secretRef:
              name: {{ .Values.ngcCatalog.secret.name }}
          {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            - name: vllm
              containerPort: {{ .Values.curator.port }}
              protocol: TCP
            - name: ray-gcs
              containerPort: {{ .Values.rayPorts.gcsServerPort }}
            - name: ray-dashboard
              containerPort: {{ .Values.rayPorts.dashboardPort }}
            - name: ray-obj-mgr
              containerPort: {{ .Values.rayPorts.objectManagerPort }}
            - name: ray-node-mgr
              containerPort: {{ .Values.rayPorts.nodeManagerPort }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.health.endpoint }}
              port: {{ .Values.health.port }} 
            initialDelaySeconds: 5
            periodSeconds: 60
            timeoutSeconds: 15 
            failureThreshold: 5
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: {{ .Values.health.endpoint }}
              port: {{ .Values.health.port }}
            initialDelaySeconds: {{ .Values.readiness.initialDelaySeconds }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: {{ .Values.health.endpoint }}
              port: {{ .Values.health.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
            successThreshold: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.logging.otlp.enabled }}
        - name: otlp-log-collector
          image: "{{ .Values.logging.otlp.image.repository }}:{{ .Values.logging.otlp.image.tag }}"
          imagePullPolicy: {{ .Values.logging.otlp.image.pullPolicy }}
          args:
            - "--config=/conf/relay.yaml"
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if gt (int .Values.logging.otlp.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.logging.otlp.preStopSleepSeconds }}
          {{- end }}
          env:
            - name: OTELCOL_TELEMETRY_LOG_LEVEL
              value: {{ .Values.logging.otlp.telemetryLogLevel | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
          {{- with .Values.logging.otlp.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /tmp
              name: temp
              readOnly: true
            - mountPath: /conf
              name: otlp-log-collector-config
              readOnly: true
            - mountPath: /var/lib/otelcol/file_storage
              name: otlp-log-collector-storage
           {{- if $otlpCertsMounted }}
            - mountPath: {{ $otlpCertDir | quote }}
              name: otlp-cert-store
              readOnly: true
           {{- end }}
           {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
           {{- end }}
          {{- with .Values.logging.otlp.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.logging.otlp.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: scratch
      {{- with .Values.persistence.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
      {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
