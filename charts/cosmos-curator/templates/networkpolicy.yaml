{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curator-ray.fullname" . }}
  labels:
    {{- include "curator-ray.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "curator-ray.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 1
          endPort: {{ sub .Values.curator.port 1 }}
        - protocol: TCP
          port: {{ add .Values.curator.port 1 }}
          endPort: 65535
      from:
        - podSelector:
            matchLabels:
              {{- include "curator-ray.selectorLabels" . | nindent 14 }}
    {{- if .Values.networkPolicy.allowInvocationFrom }}
    - ports:
        - port: {{ .Values.curator.port }}
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.allowInvocationFrom | nindent 8 }}
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
              app.kubernetes.io/instance: {{ .Release.Name }}
              component: standalone-collector
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
