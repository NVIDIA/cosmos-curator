[pytest]
pythonpath = .
testpaths = tests
addopts =
    --import-mode=importlib
    --disable-warnings
    -m 'not env and not integration and not otel_collector and not helm'
    -p tests.utils.gpu_worker_limiter
markers =
    env(name): requires specific Pixi environment
    integration: CPU integration tests exercising real Ray or runtime services in the default environment
    helm: requires the Helm binary and explicit opt-in
    otel_collector: requires an OpenTelemetry Collector container runtime and explicit opt-in
asyncio_default_fixture_loop_scope = function
